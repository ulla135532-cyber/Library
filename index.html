<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Library</title>
</head>
<body>
    <h1>Welcome to the Library</h1>

    <button id="new-book" type="button">New Book</button>

    <form id="book-form" hidden>
        <label for="title">Title:</label>
        <input id="title" type="text" required>

        <label for ="author">Author:</label>
        <input id="author" type="text" required>

        <label for="pages">Pages:</label>
        <input id="pages" type="number" min="1" required>

        <label for="read">Already Read:</label>
        <input id="read" type="checkbox">

        <button type="submit">Add Book</button>
    </form>
    <div id="library"></div>
    
</body>
</html>
